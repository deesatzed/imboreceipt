[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "imboreceipt"
version = "2.2.0"
description = "Budgeted Feature-Channel Discovery from Two-Phase Stratified Pilots, with Retrospective Evaluation of Cost-Aware Selective Querying"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "imbalanced-learn>=0.12.0",
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]
llm = [
    "httpx>=0.27.0",
]

[project.scripts]
imboreceipt = "imboreceipt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imboreceipt"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["imbora", ".venv", "data", "artifacts"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["imbora"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
